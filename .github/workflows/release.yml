# Builds the historyflow command from its source repository and publishes
# it here: a GitHub release with one archive per platform and their
# checksums, from which jdf/homebrew-historyflow writes the Homebrew
# formula.
#
# Run it from the source repository with tools/release.sh, or by hand:
#
#   gh workflow run release.yml -R jdf/historyflow-cli -f version=0.1.0 -f ref=v0.1.0
#
# The source repository is private. SOURCE_DEPLOY_KEY is a deploy key
# that can only read it; everything written is written to this
# repository, with the workflow's own token.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, as in the source's Cargo.toml (0.1.0)
        required: true
      ref:
        description: The commit, tag or branch of the source to build
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            # musl, so the one binary runs on any Linux distribution.
            targets: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jdf/historyflow
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The viewer (the page and its WebAssembly), which the command
      # embeds as it is built.
      - run: tools/build.sh release

      - name: Build the command for each target
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked -p historyflow-cli --target "$target"
          done

      - name: Check the version and package
        run: |
          mkdir dist
          for target in ${{ matrix.targets }}; do
            binary="target/$target/release/historyflow"
            # The first target of each runner is its own architecture and
            # can be run; the version it reports must be the one asked for.
            if [ "$target" = "$(echo ${{ matrix.targets }} | cut -d' ' -f1)" ]; then
              reported=$("$binary" --version)
              if [ "$reported" != "historyflow $VERSION" ]; then
                echo "::error::built '$reported', asked to release $VERSION"
                exit 1
              fi
            fi
            tar -czf "dist/historyflow-$VERSION-$target.tar.gz" \
              -C "target/$target/release" historyflow -C "$GITHUB_WORKSPACE" LICENSE
          done

      - uses: actions/upload-artifact@v4
        with:
          name: historyflow-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          gh release create "v$VERSION" dist/* \
            --title "historyflow $VERSION" \
            --notes "Install with Homebrew: \`brew install jdf/historyflow/historyflow\`. Or download the archive for your platform below, unpack it, and put \`historyflow\` on your PATH."
